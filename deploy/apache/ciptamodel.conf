# STAGED Apache reverse-proxy for CiptaModel — NOT ACTIVE until DNS points here.
# Staging steps after DNS resolves:
#   1. cp deploy/apache/ciptamodel.conf /etc/apache2/sites-available/ciptamodel.conf
#   2. a2enmod proxy proxy_http headers rewrite ; a2ensite ciptamodel ; apache2ctl configtest ; systemctl reload apache2
#   3. Only then obtain certs (certbot --apache -d ciptamodel.web.id) and enable the
#      commented <VirtualHost *:443> block below. Do NOT fabricate certificates.
#
# Assumes: Node app on 127.0.0.1:3000 (HOST=127.0.0.1 PORT=3000), this host terminates HTTP(S).

<VirtualHost *:80>
    ServerName ciptamodel.web.id
    ServerAlias www.ciptamodel.web.id
    ServerAdmin webmaster@localhost

    # ACME challenge bypass — must stay ABOVE the ProxyPass so renewals never hit Node.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    # Forwarded headers the gateway trusts (Fastify trustProxy=true).
    RequestHeader set X-Forwarded-Proto "http" env=!HTTPS

    # SSE streaming: flushpackets prevents mod_proxy_http from buffering event chunks.
    # Timeouts: generous proxy timeout so long streams/upstream calls are not cut early.
    ProxyPass / http://127.0.0.1:3000/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyTimeout 300
    Timeout 300
    KeepAlive On

    ErrorLog ${APACHE_LOG_DIR}/ciptamodel_error.log
    CustomLog ${APACHE_LOG_DIR}/ciptamodel_access.log combined
</VirtualHost>

